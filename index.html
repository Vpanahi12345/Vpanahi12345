<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>املاک‌پلاس | نرم‌افزار مدیریت املاک</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- پس‌زمینه انیمیشنی -->
<div class="bg-anim" id="bgAnim">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid-overlay"></div>
</div>

<!-- صفحه ورود -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 64 64" width="72" height="72" fill="none">
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f4d47c"/><stop offset="1" stop-color="#c9982a"/>
        </linearGradient></defs>
        <rect x="4" y="4" width="56" height="56" rx="16" fill="rgba(244,212,124,.08)" stroke="url(#lg1)" stroke-width="2"/>
        <rect x="14" y="26" width="10" height="24" rx="2" fill="url(#lg1)"/>
        <rect x="27" y="16" width="10" height="34" rx="2" fill="url(#lg1)" opacity=".85"/>
        <rect x="40" y="30" width="10" height="20" rx="2" fill="url(#lg1)" opacity=".6"/>
        <rect x="16.5" y="29" width="2.4" height="2.4" fill="#0b1224"/><rect x="19.5" y="29" width="2.4" height="2.4" fill="#0b1224"/>
        <rect x="29.5" y="19" width="2.4" height="2.4" fill="#0b1224"/><rect x="32.5" y="19" width="2.4" height="2.4" fill="#0b1224"/>
        <rect x="29.5" y="24" width="2.4" height="2.4" fill="#0b1224"/><rect x="32.5" y="24" width="2.4" height="2.4" fill="#0b1224"/>
        <rect x="42.5" y="33" width="2.4" height="2.4" fill="#0b1224"/><rect x="45.5" y="33" width="2.4" height="2.4" fill="#0b1224"/>
      </svg>
    </div>
    <h1 class="login-title">املاک‌پلاس</h1>
    <p class="login-sub">سامانه هوشمند مدیریت املاک و بنگاه‌های معاملاتی</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label>نام کاربری</label>
        <input type="text" id="loginUser" class="input" placeholder="نام کاربری" required>
      </div>
      <div class="field">
        <label>گذرواژه</label>
        <input type="password" id="loginPass" class="input" placeholder="••••••••" required>
      </div>
      <div class="login-err" id="loginErr"></div>
      <button type="submit" class="btn btn-gold btn-block" id="loginBtn">
        <span>ورود به سامانه</span>
      </button>
    </form>
    <div class="login-hint">
      <span class="hint-chip">مدیر: admin / admin123</span>
      <span class="hint-chip">کاربر: user / 123456</span>
    </div>
  </div>
</div>

<!-- بدنه برنامه -->
<div class="app-shell" id="appShell" style="display:none">

  <aside class="sidebar">
    <div class="side-logo">
      <svg viewBox="0 0 64 64" width="40" height="40" fill="none">
        <rect x="4" y="4" width="56" height="56" rx="16" fill="rgba(244,212,124,.1)" stroke="#e8c15a" stroke-width="2"/>
        <rect x="14" y="26" width="10" height="24" rx="2" fill="#e8c15a"/>
        <rect x="27" y="16" width="10" height="34" rx="2" fill="#e8c15a" opacity=".85"/>
        <rect x="40" y="30" width="10" height="20" rx="2" fill="#e8c15a" opacity=".6"/>
      </svg>
      <div>
        <div class="side-logo-title" id="sideAgencyName">املاک‌پلاس</div>
        <div class="side-logo-sub">مدیریت املاک</div>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-footer">
      <div class="user-chip" id="sideUserChip"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h2 class="page-title" id="pageTitle">داشبورد</h2>
      <div class="global-search" id="globalSearch">
        <svg class="gs-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="globalSearchInput" placeholder="جستجوی سریع در کل پایگاه داده... (کد ملک، فروشنده، آدرس، تلفن)">
        <div class="gs-results" id="gsResults"></div>
      </div>
      <div class="topbar-left">
        <span class="today-chip" id="todayChip"></span>
        <div class="user-menu" id="userMenu">
          <button class="user-btn" id="userBtn"></button>
          <div class="user-dropdown" id="userDropdown">
            <button data-act="changepass">🔑 تغییر گذرواژه</button>
            <button data-act="logout">🚪 خروج از حساب</button>
          </div>
        </div>
      </div>
    </header>
    <main class="page-content" id="pageContent"></main>
  </div>
</div>

<!-- لایه‌های عمومی -->
<div id="modalRoot"></div>
<div id="dpRoot"></div>
<div id="toastRoot"></div>
<div id="printArea"></div>

<script src="js/jalali.js"></script>
<script src="js/db.js"></script>
<script src="js/components.js"></script>
<script src="js/modules.js"></script>
<script src="js/app.js"></script>
</body>
</html>
